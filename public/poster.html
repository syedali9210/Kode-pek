<!doctype html>
<html lang="en">

    color: rgba(150, 215, 205, .5); pointer-events: none; transition: opacity 1.2s ease;

  @media (max-width: 560px) { #hint { letter-spacing: .14em; font-size: 10px; } }

<body>
<div id="hint">drag to tilt · press buttons · turn the knob</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------------------------------------------------------------- utils
const TAU = Math.PI * 2;
const clamp01 = x => Math.min(1, Math.max(0, x));
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeOutBack = (x, s = 1.7) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
let seed = 11;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const motionOK = !matchMedia('(prefers-reduced-motion: reduce)').matches;

// fonts must be ready before we paint canvases
const gf = document.getElementById('gf');
await Promise.race([
  (async () => {
    if (!gf.sheet) await new Promise(r => gf.addEventListener('load', r, { once: true }));
    await Promise.all(['200px Pacifico', '120px Oswald', '200px "Archivo Black"', '800 120px Archivo', '40px VT323']
      .map(f => document.fonts.load(f)));
  })(),
  new Promise(r => setTimeout(r, 4000)),
]);

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.domElement.setAttribute('role', 'img');
renderer.domElement.setAttribute('aria-label', "Brunch n' Play: interactive handheld console poster, 13 Oct, Sunday");
document.body.appendChild(renderer.domElement);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
const camBase = new THREE.Vector3();
const LOOK = new THREE.Vector3(0, 0.12, 0);

function canvasTex(canvas, srgb = true) {
  const t = new THREE.CanvasTexture(canvas);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  return t;
}
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// ---------------------------------------------------------------- background (full-screen quad)
const bgCanvas = makeCanvas(2, 2);
const bgMat = new THREE.ShaderMaterial({
  depthWrite: false, depthTest: false,
  uniforms: {
    uText: { value: null }, uTime: { value: 0 }, uReveal: { value: 0 }, uPar: { value: new THREE.Vector2() }, uAspect: { value: 1 },
    cTop: { value: new THREE.Color('#0c1a1f') }, cBot: { value: new THREE.Color('#12393d') },
    cGlow: { value: new THREE.Color('#1c3632') }, cHaze: { value: new THREE.Color('#e3cec8') },
    cLine: { value: new THREE.Color('#0f5652') },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.9999, 1.0); }`,
  fragmentShader: /* glsl */`
    varying vec2 vUv;
    uniform sampler2D uText; uniform float uTime, uReveal, uAspect; uniform vec2 uPar;
    uniform vec3 cTop, cBot, cGlow, cHaze, cLine;
    void main(){
      vec2 uv = vUv;
      vec3 col = mix(cBot, cTop, smoothstep(0.02, 0.8, uv.y));
      vec2 k = vec2(uAspect, 1.0) / min(uAspect, 1.0);
      vec2 g = (uv - vec2(0.97, 0.46)) * k * vec2(1.5, 1.0);
      col += cGlow * exp(-dot(g, g) * 3.2);
      vec2 h = (uv - vec2(1.03, 0.0)) * k * vec2(3.4, 1.35);
      col = mix(col, cHaze, exp(-dot(h, h) * 4.0) * 0.92);
      vec2 tuv = (uv - 0.5) * 0.985 + 0.5 + uPar;
      float a = texture2D(uText, tuv).a;
      float r = (uv.x + (1.0 - uv.y)) * 0.5;
      float m = smoothstep(uReveal * 1.35 - 0.05, uReveal * 1.35 - 0.22, r);
      float shimmer = 1.0 + 0.9 * smoothstep(0.05, 0.0, abs(fract(r * 1.1 - uTime * 0.05) - 0.5));
      col = mix(col, cLine * shimmer, a * m);
      gl_FragColor = vec4(col, 1.0);
    }`,
});
const bgQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat);
bgQuad.frustumCulled = false; bgQuad.renderOrder = -10;
scene.add(bgQuad);

function drawBg() {
  const dpr = renderer.getPixelRatio();
  const Wc = Math.round(innerWidth * dpr), Hc = Math.round(innerHeight * dpr);
  bgCanvas.width = Wc; bgCanvas.height = Hc;
  const c = bgCanvas.getContext('2d');
  const cols = 6, cw = Wc / cols, ch = Math.min(Math.max(cw * 1.05, Hc * 0.12), Hc * 0.205), top = Hc * 0.018;
  const lw = Math.max(1, 1.5 * dpr);
  c.strokeStyle = '#fff';
  c.lineWidth = lw; c.globalAlpha = 0.55;
  c.beginPath();
  for (let r = 0; r <= 2; r++) { c.moveTo(0, top + r * ch); c.lineTo(Wc, top + r * ch); }
  for (let i = 0; i <= cols; i++) {
    const x = Math.min(Wc - lw / 2, Math.max(lw / 2, i * cw));
    c.moveTo(x, top); c.lineTo(x, top + 2 * ch);
  }
  c.stroke();
  c.globalAlpha = 1;
  c.font = '200px "Archivo Black"';
  const capH = c.measureText('H').actualBoundingBoxAscent;
  ['BRUNCH', "N'PLAY"].forEach((row, r) => [...row].forEach((chr, i) => {
    const m = c.measureText(chr);
    const gw = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
    const px = cw * 0.07, py = ch * 0.12;
    const sy = (ch - 2 * py) / capH;
    let sx = (cw - 2 * px) / gw, ox = i * cw + px;
    if (chr === "'") { sx = sy; ox = i * cw + (cw - gw * sx) / 2; }
    c.save();
    c.translate(ox, top + r * ch + py);
    c.scale(sx, sy);
    c.lineWidth = 1.7 * dpr / Math.sqrt(sx * sy);
    c.strokeText(chr, m.actualBoundingBoxLeft, m.actualBoundingBoxAscent);
    c.restore();
  }));
  bgMat.uniforms.uText.value?.dispose();
  bgMat.uniforms.uText.value = canvasTex(bgCanvas, false);
}

// ---------------------------------------------------------------- lights
scene.add(new THREE.HemisphereLight('#cfeee8', '#2a1e1c', 0.3));
const key = new THREE.DirectionalLight('#fff3ea', 1.9);
key.position.set(4.5, 4.0, 5.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -2.4, right: 2.4, top: 2.4, bottom: -2.4, near: 1, far: 20 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.012;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight('#bfe4ff', 0.9);
rim.position.set(-1.5, 5, -3);
scene.add(rim);

// ---------------------------------------------------------------- materials
const M = {
  body: new THREE.MeshPhysicalMaterial({ color: '#f5ddd5', roughness: 0.42, metalness: 0.08, clearcoat: 0.35, clearcoatRoughness: 0.4 }),
  chrome: new THREE.MeshStandardMaterial({ color: '#f1eff4', metalness: 1, roughness: 0.18 }),
  lilac: new THREE.MeshStandardMaterial({ color: '#bdb6dc', metalness: 0.85, roughness: 0.3 }),
  dark: new THREE.MeshStandardMaterial({ color: '#150f10', roughness: 0.75 }),
  gun: new THREE.MeshPhysicalMaterial({ color: '#3b2f2d', metalness: 0.75, roughness: 0.3, clearcoat: 0.6, clearcoatRoughness: 0.2 }),
  white: new THREE.MeshPhysicalMaterial({ color: '#e9ebef', roughness: 0.3, clearcoat: 0.8, clearcoatRoughness: 0.15 }),
  clover: new THREE.MeshPhysicalMaterial({ color: '#cfe7f7', roughness: 0.35, clearcoat: 0.6, clearcoatRoughness: 0.2 }),
  tagFace: new THREE.MeshPhysicalMaterial({ color: '#f4e79c', roughness: 0.45, clearcoat: 0.3 }),
  tagSide: new THREE.MeshPhysicalMaterial({ color: '#f5c01e', roughness: 0.4, clearcoat: 0.3 }),
  card: new THREE.MeshPhysicalMaterial({ color: '#7b7ef0', roughness: 0.35, clearcoat: 0.6, clearcoatRoughness: 0.2 }),
  coral: new THREE.MeshPhysicalMaterial({ color: '#f5664a', roughness: 0.4, clearcoat: 0.5, clearcoatRoughness: 0.25 }),
  rubber: new THREE.MeshStandardMaterial({ color: '#f1efe9', roughness: 0.55 }),
  redLed: new THREE.MeshStandardMaterial({ color: '#ff3a2a', emissive: '#ff2a1a', emissiveIntensity: 1.5, roughness: 0.3 }),
  magLed: new THREE.MeshStandardMaterial({ color: '#c0287e', emissive: '#e0208c', emissiveIntensity: 1.2, roughness: 0.3 }),
  slot: new THREE.MeshStandardMaterial({ color: '#ffffff', emissive: '#ffffff', emissiveIntensity: 0.6, roughness: 0.25 }),
};

// ---------------------------------------------------------------- geometry helpers
function rr(path, w, h, r, cx = 0, cy = 0) {
  const x = cx - w / 2, y = cy - h / 2;
  path.moveTo(x + r, y);
  path.lineTo(x + w - r, y); path.absarc(x + w - r, y + r, r, -Math.PI / 2, 0, false);
  path.lineTo(x + w, y + h - r); path.absarc(x + w - r, y + h - r, r, 0, Math.PI / 2, false);
  path.lineTo(x + r, y + h); path.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI, false);
  path.lineTo(x, y + r); path.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5, false);
  return path;
}
function extrude(shape, depth, bevel, segs = 4, crease = 0.7) {
  const g = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: segs, curveSegments: 24,
  });
  return toCreasedNormals(g, crease);
}
const V2 = pts => pts.map(([x, y]) => new THREE.Vector2(x, y));

// ---------------------------------------------------------------- device
const W = 2.0, H = 2.56, D = 0.8, FZ = D / 2;
const rig = new THREE.Group();
const device = new THREE.Group();
rig.add(device);
scene.add(rig);
key.target = device;
const pickables = [];
function tagAction(obj, action) { obj.traverse(o => { if (o.isMesh) { o.userData.action = action; pickables.push(o); } }); return obj; }

// front plate with screen opening
{
  const s = rr(new THREE.Shape(), W - 0.08, H - 0.08, 0.12);
  s.holes.push(rr(new THREE.Path(), 1.76, 1.28, 0.14, 0, 0.5));
  const plate = new THREE.Mesh(extrude(s, 0.10, 0.04), M.body);
  plate.position.z = FZ - 0.14;
  device.add(plate); pickables.push(plate);

  const b = rr(new THREE.Shape(), W - 0.104, H - 0.104, 0.11);
  const back = new THREE.Mesh(extrude(b, D - 0.24, 0.04), M.body);
  back.position.z = -FZ + 0.04;
  device.add(back); pickables.push(back);
}

// screen
const logoCanvas = makeCanvas(1024, 640);
{
  const c = logoCanvas.getContext('2d');
  c.translate(512, 330); c.rotate(-0.075);
  c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.font = '215px Pacifico';
  c.strokeStyle = '#fff'; c.lineWidth = 11; c.lineJoin = 'round';
  for (const [t, x, y] of [['Brunch', -30, -30], ["n' Play", 60, 180]]) { c.strokeText(t, x, y); c.fillText(t, x, y); }
}
const osdCanvas = makeCanvas(512, 358);
const osdCtx = osdCanvas.getContext('2d');
const osdTex = canvasTex(osdCanvas);

const PALETTES = [
  { name: 'GREEN ROOM', dark: '#010c04', mid: '#10d23c', high: '#dcffd4' },
  { name: 'BLUE HOUR', dark: '#01040f', mid: '#2f6bff', high: '#dbe9ff' },
  { name: 'GOLDEN HOUR', dark: '#0e0600', mid: '#ffb21c', high: '#fff5d4' },
  { name: 'RED ROOM', dark: '#100105', mid: '#ff3548', high: '#ffe1dd' },
].map(p => ({ ...p, c: [new THREE.Color(p.dark), new THREE.Color(p.mid), new THREE.Color(p.high)] }));

const screenMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 }, uGlitch: { value: 0 }, uOff: { value: 1 }, uBeat: { value: 0 }, uSheen: { value: 0 },
    uSize: { value: new THREE.Vector2(1.74, 1.26) },
    uDark: { value: PALETTES[0].c[0].clone() }, uMid: { value: PALETTES[0].c[1].clone() }, uHigh: { value: PALETTES[0].c[2].clone() },
    uLogo: { value: canvasTex(logoCanvas) }, uOsd: { value: osdTex },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform float uTime, uGlitch, uOff, uBeat, uSheen;
    uniform vec2 uSize;
    uniform vec3 uDark, uMid, uHigh;
    uniform sampler2D uLogo, uOsd;
    #define ASPECT 1.43

    float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
    float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
    float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ v += a * noise(p); p = p * 2.03 + 17.1; a *= 0.5; } return v; }
    float leaves(vec2 p, float t){
      vec2 i = floor(p), f = fract(p); float best = 9.0, id = 0.0;
      for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++){
        vec2 g = vec2(float(x), float(y));
        vec2 h = vec2(hash(i + g), hash(i + g + 19.7));
        vec2 o = 0.5 + 0.38 * sin(t * 0.5 + 6.2831 * h);
        vec2 r = g + o - f; float d = dot(r, r);
        if (d < best){ best = d; id = h.x; }
      }
      return id * smoothstep(0.62, 0.05, sqrt(best));
    }
    float sdRR(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
    float inBox(vec2 u){ return step(0.0, u.x) * step(u.x, 1.0) * step(0.0, u.y) * step(u.y, 1.0); }

    // procedural green-lit brunch venue: foliage canopy, vines, fairy lights, bokeh, crowd
    float sceneLum(vec2 uv, float t){
      vec2 p = vec2(uv.x * ASPECT, uv.y);
      vec2 ps = p + vec2(0.012 * sin(t * 0.7 + p.y * 4.0), 0.0);
      // soft room light: dim at the bottom, broad green wash in the middle
      float L = 0.03 + 0.1 * smoothstep(0.1, 1.0, uv.y) + 0.5 * smoothstep(0.3, 0.75, fbm(p * 1.6 + vec2(0.0, t * 0.02)));
      // foliage canopy: dense leaves up top, ragged lower edge
      float edge = 0.52 + 0.22 * fbm(vec2(p.x * 2.6, 3.1));
      float canopy = smoothstep(edge - 0.12, edge + 0.1, uv.y);
      float lv = leaves(ps * 11.0, t) * 0.75 + leaves(ps * 23.0 + 7.0, t * 1.3) * 0.55 + leaves(ps * 45.0 + 3.0, t) * 0.3;
      float dap = fbm(ps * 4.0 + vec2(t * 0.05, 0.0));
      L = mix(L, 0.02 + lv * (0.25 + 0.9 * dap), canopy * 0.9);
      // hanging tendrils below the canopy (organic, not periodic)
      float tn = noise(vec2(ps.x * 38.0, uv.y * 1.3 + 4.0));
      float tendril = smoothstep(0.72, 0.9, tn) * smoothstep(edge - 0.32, edge, uv.y) * (1.0 - canopy);
      L += tendril * (0.2 + 0.5 * leaves(ps * vec2(40.0, 60.0), t));
      // pale statue-ish glow on the right, like the reference photo
      vec2 sg = (uv - vec2(0.84, 0.58)) * vec2(1.3, 0.85);
      L += 0.95 * exp(-dot(sg, sg) * 11.0) * (0.75 + 0.25 * fbm(p * 8.0));
      // one sagging string of fairy lights
      {
        float y0 = 0.9;
        float wire = y0 - 0.09 * sin(3.14159 * uv.x);
        L += 0.06 * smoothstep(0.003, 0.0, abs(uv.y - wire));
        float sx = uv.x * 9.0;
        float bx = (floor(sx) + 0.5) / 9.0;
        float by = y0 - 0.09 * sin(3.14159 * bx) - 0.015;
        float d = length(vec2((uv.x - bx) * ASPECT, uv.y - by));
        float tw = 0.55 + 0.45 * sin(t * 2.2 + floor(sx) * 2.1);
        L += (smoothstep(0.012, 0.005, d) * 1.8 + exp(-d * d * 700.0) * 0.5) * tw;
      }
      for (int k = 0; k < 10; k++){
        float fk = float(k);
        vec2 c = vec2(hash(vec2(fk, 1.7)), 0.3 + 0.7 * hash(vec2(fk, 2.9)));
        c += 0.02 * vec2(sin(t * 0.37 + fk * 1.1), cos(t * 0.29 + fk * 1.7));
        float r = 0.015 + 0.03 * hash(vec2(fk, 3.3));
        float d = length((uv - c) * vec2(ASPECT, 1.0));
        float disc = smoothstep(r, r - 0.008, d);
        float tw = 0.3 + 0.25 * sin(t * 1.3 + fk * 2.3);
        L += disc * tw * (0.45 + 0.5 * smoothstep(r - 0.012, r, d));
      }
      float crowd = 0.0;
      for (int k = 0; k < 11; k++){
        float fk = float(k);
        float cx = (fk + 0.1 + 0.6 * hash(vec2(fk, 5.0))) / 10.6;
        float bob = 0.006 * sin(t * 1.9 + fk * 2.4) + uBeat * 0.022 * (0.5 + hash(vec2(fk, 6.0)));
        float hy = 0.19 + 0.07 * hash(vec2(fk, 9.0)) + bob;
        vec2 hp = vec2((uv.x - cx) * ASPECT, uv.y - hy);
        float head = smoothstep(0.043, 0.036, length(hp * vec2(1.0, 0.88)));
        vec2 bp = vec2((uv.x - cx) * ASPECT * 0.82, uv.y - hy + 0.135);
        float body = smoothstep(0.105, 0.097, length(bp));
        crowd = max(crowd, max(head, body));
      }
      L = mix(L, 0.012, crowd * 0.94);
      L += 0.18 * smoothstep(0.09, 0.0, uv.y) * noise(vec2(uv.x * 18.0, t * 0.5));
      return L;
    }
    vec3 grade(float L){
      vec3 c = mix(uDark, uMid, smoothstep(0.02, 0.55, L));
      c = mix(c, uHigh, smoothstep(0.55, 1.15, L));
      return c * (1.0 + max(L - 0.9, 0.0) * 1.8);
    }
    vec3 image(vec2 uv, float t){
      float gl = uGlitch;
      float tq = floor(t * 24.0);
      float band = floor(uv.y * 34.0);
      float jump = step(0.55, hash(vec2(band, tq)));
      uv.x += (hash(vec2(band * 1.3, tq + 1.0)) - 0.5) * 0.16 * gl * jump;
      uv.y += gl * 0.03 * sin(tq);
      vec3 col = grade(sceneLum(uv, t));
      vec2 lc = uv - vec2(0.47, 0.6 + 0.008 * sin(t * 1.7) + uBeat * 0.012);
      lc /= (1.0 + uBeat * 0.05);
      vec2 luv = lc / vec2(0.86, 0.86 * ASPECT / 1.6) + 0.5;
      float ca = 0.004 + 0.03 * gl;
      float la = texture2D(uLogo, luv).a * inBox(luv);
      float lr = texture2D(uLogo, luv + vec2(ca, 0.0)).a * inBox(luv);
      float lb = texture2D(uLogo, luv - vec2(ca, 0.0)).a * inBox(luv);
      vec2 suv = luv + vec2(-0.01, 0.022);
      float sh = texture2D(uLogo, suv).a * inBox(suv);
      col *= 1.0 - sh * 0.6;
      col = mix(col, vec3(1.3), la);
      col.r += lr * 0.4 * (1.0 - la); col.b += lb * 0.4 * (1.0 - la);
      vec4 o = texture2D(uOsd, uv) * inBox(uv);
      col = mix(col, o.rgb * 1.4, o.a);
      float sl = 0.5 + 0.5 * sin(uv.y * 6.2831 * 105.0);
      col *= 0.74 + 0.26 * sl;
      col *= 1.0 + 0.07 * smoothstep(0.12, 0.0, abs(fract(uv.y * 0.6 - t * 0.13) - 0.5));
      col *= 0.975 + 0.025 * sin(t * 50.0);
      float n = hash(uv * vec2(913.0, 571.0) + fract(t * 7.13) * 91.0);

const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _zero = new THREE.Vector3();
function burst(origin, n = 140) {
  let spawned = 0;
  for (const p of parts) {
    if (p.life > 0 || spawned >= n) continue;
    spawned++;
    p.p.copy(origin);
    const a = rand() * TAU, up = 0.4 + rand() * 0.9;
    p.v.set(Math.cos(a) * (1 + rand() * 2.2), 2.2 + up * 3.2, 1.2 + rand() * 2.6);
    p.r.set(rand() * TAU, rand() * TAU, rand() * TAU);
    p.w.set((rand() - 0.5) * 16, (rand() - 0.5) * 16, (rand() - 0.5) * 16);
    p.life = 2.6 + rand() * 1.2;
  }
}
function updateConfetti(dt, t) {
  parts.forEach((p, i) => {
    if (p.life > 0) {
      p.life -= dt;
      p.v.y -= 6.5 * dt;
      p.v.multiplyScalar(Math.pow(0.35, dt));
      p.v.x += Math.sin(t * 6 + i) * 1.2 * dt;
      p.p.addScaledVector(p.v, dt);
      p.r.x += p.w.x * dt; p.r.y += p.w.y * dt; p.r.z += p.w.z * dt;
      _s.setScalar(Math.min(1, p.life * 2));
      _m.compose(p.p, _q.setFromEuler(p.r), _s);
    } else _m.compose(_zero, _q.identity(), _s.setScalar(0));
    confetti.setMatrixAt(i, _m);
  });
  confetti.instanceMatrix.needsUpdate = true;
}

    musicBus.connect(lp).connect(master);
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function tone(f, t, dur, type = 'square', g = 0.1, dest = master, slide = 0) {
  const o = actx.createOscillator(), v = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + dur);
  v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(g, t + 0.006);
  v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(v).connect(dest); o.start(t); o.stop(t + dur + 0.03);
}
function hiss(t, dur, g = 0.2, freq = 3000, type = 'highpass', dest = master) {
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const v = actx.createGain(); v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(v).connect(dest); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
}
const sfx = {
  btn(i) { const t = ac().currentTime; hiss(t, 0.03, 0.25, 4000); tone([523, 659, 784][i], t, 0.14, 'square', 0.09, master, 0.5); tone([1046, 1318, 1568][i], t + 0.05, 0.1, 'square', 0.05); },
  tick() { const t = ac().currentTime; hiss(t, 0.015, 0.2, 6000); },
  click() { const t = ac().currentTime; hiss(t, 0.025, 0.35, 2500, 'bandpass'); hiss(t + 0.07, 0.02, 0.25, 3500, 'bandpass'); },
  powerOn() { const t = ac().currentTime; tone(90, t, 0.25, 'sine', 0.3, master, 0.4); hiss(t, 0.35, 0.12, 1800); tone(1400, t + 0.05, 0.35, 'sine', 0.03, master, 1.6); },
  powerOff() { const t = ac().currentTime; tone(700, t, 0.3, 'sine', 0.14, master, 0.2); hiss(t, 0.12, 0.1, 2500); },
  static() { const t = ac().currentTime; hiss(t, 0.28, 0.22, 1200, 'bandpass'); },
  boing() { const t = ac().currentTime; tone(220, t, 0.35, 'sine', 0.18, master, 1.9); },
  arp(up) { const t = ac().currentTime; (up ? [60, 64, 67, 72, 76] : [76, 72, 67, 64, 60]).forEach((m, i) => tone(mtof(m), t + i * 0.055, 0.12, 'square', 0.07)); },
};

// chiptune loop, scheduled ahead of time on the audio clock
const BPM = 116, STEP = 60 / BPM / 4;
const CHORDS = [[65, 69, 72, 76], [67, 71, 74, 77], [64, 67, 71, 74], [69, 72, 76, 79]];
const BASS = [41, 43, 40, 45];
const LEAD = [72, 0, 76, 0, 77, 76, 72, 0, 74, 0, 77, 0, 79, 77, 74, 0, 71, 0, 74, 0, 76, 74, 71, 74, 72, 0, 0, 76, 0, 74, 72, 0];
let music = false, musicTimer = 0, nextNote = 0, stepIdx = 0;
const kicks = []; let lastKick = -10;
function playStep(s, t) {
  const bar = Math.floor(s / 16) % 4, i = s % 16, chord = CHORDS[bar];
  if (i % 4 === 0) { tone(150, t, 0.16, 'sine', 0.55, musicBus, 0.27); kicks.push(t); }
  if (i === 4 || i === 12) { hiss(t, 0.14, 0.28, 1800, 'bandpass', musicBus); tone(190, t, 0.08, 'triangle', 0.15, musicBus, 0.6); }
  if (i % 2 === 1) hiss(t, 0.035, 0.1, 7000, 'highpass', musicBus);
  if ([0, 3, 6, 8, 10, 14].includes(i)) tone(mtof(BASS[bar] + (i === 10 ? 7 : 0)), t, STEP * 1.5, 'triangle', 0.32, musicBus);
  tone(mtof(chord[[0, 1, 2, 3, 2, 1, 2, 3][i % 8]] + 12), t, STEP * 0.8, 'square', 0.025, musicBus);
  if (i % 2 === 0) { const n = LEAD[(bar * 8 + i / 2) % 32]; if (n) tone(mtof(n), t, STEP * 1.8, 'square', 0.05, musicBus); }
}
function scheduler() {
  while (nextNote < actx.currentTime + 0.12) { playStep(stepIdx, nextNote); nextNote += STEP; stepIdx = (stepIdx + 1) % 64; }
}
function setMusic(on) {
  if (on === music) return;
  music = on;
  ac();
  if (on) { nextNote = actx.currentTime + 0.05; stepIdx = 0; musicTimer = setInterval(scheduler, 25); scheduler(); }
  else { clearInterval(musicTimer); kicks.length = 0; }
  drawSmiley(on);
}

// ---------------------------------------------------------------- state + actions
const state = {
  power: true, powerAnim: 1, channel: 0, glitch: 0, cardOut: 0, cardTarget: 0,
  osdCh: 0, osdVol: 0, osdMsg: '', osdMsgUntil: 0, starPop: 0, cloverSpin: 0,
};
const clock = new THREE.Clock();
const now = () => clock.elapsedTime;

function setChannel(c) {
  state.channel = c;
  state.glitch = 1;
  state.osdCh = now() + 2.6;
}
function actionDown(action) {
  ac();
  hideHint();
  const t = now();
  if (action.startsWith('btn')) {
    const i = +action[3];
    sfx.btn(i);
    if (state.power) setChannel(state.channel === i + 1 ? 0 : i + 1);
  } else if (action === 'smiley') {
    if (!state.power) { sfx.tick(); return; }
    setMusic(!music);
    sfx.arp(music);
    state.starPop = 1;
    if (music) {
      const s = buttons.find(b => b.action === 'smiley');
      burst(s.g.getWorldPosition(new THREE.Vector3()));
    }
  } else if (action === 'clover') {
    state.power = !state.power;
    state.cloverSpin += Math.PI / 2;
    if (state.power) { sfx.powerOn(); state.osdCh = t + 3.2; } else { sfx.powerOff(); setMusic(false); }
  } else if (action === 'card') {
    state.cardTarget = state.cardTarget ? 0 : 1;
    sfx.click();
    if (state.power) { state.glitch = 0.8; state.osdMsg = state.cardTarget ? 'NO CARD' : 'CARD OK ✓'; state.osdMsgUntil = t + 1.8; }
  } else if (action === 'tag') {
    tagSwing.v += (rand() > 0.5 ? 1 : -1) * 7; ringSwing.v += 9;
    sfx.boing();
  } else if (action === 'screen') {
    if (state.power) { state.glitch = 1; sfx.static(); }
  }
}
function setVolume(v) {
  const prev = volume;
  volume = clamp01(v);
  if (Math.floor(prev * 20) !== Math.floor(volume * 20)) sfx.tick();
  if (master) master.gain.setTargetAtTime(volume, actx.currentTime, 0.02);
  state.osdVol = now() + 1.6;
}

// OSD redraw only when its content changes
let osdSig = '';
function drawOsd(t) {
  const ch = t < state.osdCh ? `CH 0${state.channel + 1}  ${PALETTES[state.channel].name}` : '';
  const play = music && (t % 1 < 0.6) ? '► PLAY' : '';
  const vol = t < state.osdVol ? Math.round(volume * 12) : -1;
  const msg = t < state.osdMsgUntil && (t % 0.5 < 0.35) ? state.osdMsg : '';
  const sig = [ch, play, vol, msg].join('|');
  if (sig === osdSig) return;
  osdSig = sig;
  const c = osdCtx;
  c.clearRect(0, 0, 512, 358);
  c.font = '34px VT323'; c.textBaseline = 'top';
  const txt = (s, x, y, align = 'left') => {
    c.textAlign = align;
    c.fillStyle = 'rgba(0,0,0,.55)'; c.fillText(s, x + 2, y + 2);
    c.fillStyle = '#ecffec'; c.fillText(s, x, y);
  };
  if (ch) txt(ch, 26, 20);
  if (play) txt(play, 486, 20, 'right');
  if (vol >= 0) {
    txt('VOL', 70, 296);
    for (let i = 0; i < 12; i++) {
      c.fillStyle = 'rgba(0,0,0,.5)'; c.fillRect(132 + i * 25 + 2, 300 + 2, 17, 24);
      c.fillStyle = i < vol ? '#ecffec' : 'rgba(236,255,236,.25)'; c.fillRect(132 + i * 25, 300, 17, 24);
    }
  }
  if (msg) txt(msg, 256, 160, 'center');
  osdTex.needsUpdate = true;
}

// ---------------------------------------------------------------- input
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const pointer = { x: 0, y: 0 };
let hovered = null, pressed = null, knobDrag = null, drag = null;
const dragOff = { x: 0, y: 0 }, dragVel = { x: 0, y: 0 };
const canvas = renderer.domElement;

function pick(e) {
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(pickables, false)[0];
  return hit ? hit.object.userData.action || 'body' : null;
}
let hintHidden = false;
function hideHint() { if (!hintHidden) { hintHidden = true; document.getElementById('hint').style.opacity = 0; } }

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  const a = pick(e);
  if (a === 'knob') { knobDrag = { y: e.clientY, v: volume }; ac(); hideHint(); return; }
  if (a && a !== 'body') {
    pressed = buttons.find(b => b.action === a) || null;
    if (pressed) pressed.target = 1;
    actionDown(a);
    return;
  }
  drag = { x: e.clientX, y: e.clientY, t: performance.now() };
});
canvas.addEventListener('pointermove', e => {
  pointer.x = e.clientX / innerWidth * 2 - 1;
  pointer.y = -(e.clientY / innerHeight * 2 - 1);
  if (knobDrag) { setVolume(knobDrag.v + (knobDrag.y - e.clientY) / 220); return; }
  if (drag) {
    const tNow = performance.now(), dt = Math.max(1, tNow - drag.t) / 1000;
    const dx = (e.clientX - drag.x) * 0.007, dy = (e.clientY - drag.y) * 0.007;
    dragOff.x = THREE.MathUtils.clamp(dragOff.x + dx, -1.3, 1.3);
    dragOff.y = THREE.MathUtils.clamp(dragOff.y + dy, -0.9, 0.9);
    dragVel.x = dx / dt; dragVel.y = dy / dt;
    Object.assign(drag, { x: e.clientX, y: e.clientY, t: tNow });
    hideHint();
    return;
  }
  const a = pick(e);
  hovered = a && a !== 'body' ? a : null;
  canvas.style.cursor = hovered ? (hovered === 'knob' ? 'ns-resize' : 'pointer') : (a ? 'grab' : 'default');
});
const release = () => {
  if (pressed) pressed.target = 0;
  pressed = null; knobDrag = null;
  if (drag && performance.now() - drag.t > 80) dragVel.x = dragVel.y = 0;
  drag = null;
};
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('pointerleave', () => { pointer.x = pointer.y = 0; });
canvas.addEventListener('wheel', e => {
  if (pick(e) === 'knob') { e.preventDefault(); setVolume(volume - e.deltaY * 0.0012); }
}, { passive: false });
addEventListener('keydown', e => {
  const map = { '1': 'btn0', '2': 'btn1', '3': 'btn2', ' ': 'smiley', p: 'clover', c: 'card' };
  const a = map[e.key.toLowerCase()];
  if (!a || e.repeat) return;
  e.preventDefault();
  const b = buttons.find(x => x.action === a);
  if (b) { b.target = 1; setTimeout(() => (b.target = 0), 130); }
  actionDown(a);
});

// ---------------------------------------------------------------- animation loop
const REST = new THREE.Euler(-0.16, 0.5, 0.1);
const tilt = { x: 0, y: 0 };
const tagSwing = { a: 0, v: 0 }, ringSwing = { a: 0, v: 0 };
let prevRot = new THREE.Vector3(), prevAngVel = new THREE.Vector3();
const INTRO = motionOK ? 0 : 10;
const cardBaseX = card.position.x;
let power = 1; // animated uOff value

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  const it = t + INTRO;
  const fl = motionOK ? 1 : 0;

  // beat
  let beat = 0;
  if (actx && music) {
    while (kicks.length && kicks[0] <= actx.currentTime) lastKick = kicks.shift();
    beat = Math.exp(-(actx.currentTime - lastKick) * 7);
  }

  // intro choreography
  const sDev = seg(it, 0.05, 1.25), sStar = seg(it, 0.45, 1.15), sBadge = seg(it, 0.3, 1.4);
  device.scale.setScalar(0.72 + 0.28 * easeOutBack(sDev, 1.4));
  device.position.y = (1 - easeOutCubic(sDev)) * -0.7;

  // pointer tilt + drag spring
  tilt.x = damp(tilt.x, pointer.x, 3.5, dt);
  tilt.y = damp(tilt.y, pointer.y, 3.5, dt);
  if (!drag) {
    for (const k of ['x', 'y']) {
      dragVel[k] += (-dragOff[k] * 30 - dragVel[k] * 6.5) * dt;
      dragOff[k] += dragVel[k] * dt;
    }
  }
  rig.rotation.set(
    REST.x - tilt.y * 0.16 + dragOff.y + Math.sin(t * 0.8) * 0.025 * fl,
    REST.y + tilt.x * 0.26 + dragOff.x + Math.sin(t * 0.55) * 0.04 * fl + (1 - easeOutCubic(sDev)) * -1.4,
    REST.z + Math.sin(t * 0.7 + 1) * 0.015 * fl,
  );
  rig.position.y = Math.sin(t * 1.1) * 0.045 * fl + beat * 0.02;

  // wobbly attachments react to angular acceleration
  const rot = new THREE.Vector3(rig.rotation.x, rig.rotation.y, rig.rotation.z);
  const angVel = rot.clone().sub(prevRot).divideScalar(Math.max(dt, 1e-3));
  const kick = angVel.clone().sub(prevAngVel);
  prevRot = rot; prevAngVel = angVel;
  tagSwing.v += (-tagSwing.a * 70 - tagSwing.v * 3.2) * dt - kick.y * 0.35 - kick.z * 0.6;
  tagSwing.a += tagSwing.v * dt;
  ringSwing.v += (-ringSwing.a * 45 - ringSwing.v * 2.2) * dt - kick.y * 0.6 + kick.x * 0.4;
  ringSwing.a += ringSwing.v * dt;
  tagPivot.rotation.z = -0.2 + THREE.MathUtils.clamp(tagSwing.a, -0.6, 0.6);
  ringPivot.rotation.x = 0.3 + THREE.MathUtils.clamp(ringSwing.a, -1, 1);

  // camera parallax
  camera.position.set(camBase.x + tilt.x * 0.18, camBase.y + tilt.y * 0.1, camBase.z);
  camera.lookAt(LOOK);

  // buttons
  for (const b of buttons) {
    b.press = damp(b.press, b.target, b.target ? 40 : 18, dt);
    b.hover = damp(b.hover, hovered === b.action ? 1 : 0, 12, dt);
    b.cap.position.y = (b.base || 0) - b.press * b.depth + b.hover * 0.006;
  }
  state.cloverSpin && (clover.rotation.z = damp(clover.rotation.z, Math.PI / 4 + state.cloverSpin, 10, dt));
  clover.position.z = FZ + (hovered === 'clover' ? 0.008 : 0);
  knob.rotation.y = -volume * TAU * 0.8;

  // card
  state.cardOut = damp(state.cardOut, state.cardTarget, 9, dt);
  card.position.x = cardBaseX + state.cardOut * 0.22 + (hovered === 'card' ? 0.015 : 0);

  // power animation (uOff: 0 on -> 1 off); boot at intro
  const wantOn = state.power && it > 1.0;
  power = wantOn ? Math.max(0, power - dt * 2.4) : Math.min(1, power + dt * 2.2);
  if (wantOn && power <= 0 && state.osdCh === 0) state.osdCh = t + 2.8;

  // screen uniforms
  state.glitch = Math.max(0, state.glitch - dt * 2.8);
  const pal = PALETTES[state.channel].c;
  const u = screenMat.uniforms;
  u.uDark.value.lerp(pal[0], 1 - Math.exp(-dt * 6));
  u.uMid.value.lerp(pal[1], 1 - Math.exp(-dt * 6));
  u.uHigh.value.lerp(pal[2], 1 - Math.exp(-dt * 6));
  u.uTime.value = t;
  u.uGlitch.value = state.glitch;
  u.uOff.value = power;
  u.uBeat.value = beat;
  u.uSheen.value = (rig.rotation.y - REST.y) * 0.7 + (rig.rotation.x - REST.x) * 0.5;
  drawOsd(t);

  // lights on the device
  const on = 1 - power;
  M.slot.emissiveIntensity = (0.35 + beat * 1.6) * on + 0.02;
  M.redLed.emissiveIntensity = 0.3 + 3 * Math.pow(Math.max(0, Math.sin(t * 2.2)), 16) * on;
  M.magLed.emissiveIntensity = (music ? 0.4 + beat * 3.5 : 0.5 + 0.45 * Math.sin(t * 1.4)) * on + 0.05;

  // poster graphics
  state.starPop = Math.max(0, state.starPop - dt * 2.5);
  const pop = Math.sin(state.starPop * Math.PI);
  star.scale.setScalar(easeOutBack(sStar, 2.6) * (1 + 0.025 * Math.sin(t * 2.1) * fl + beat * 0.1 + pop * 0.25));
  star.rotation.z += dt * (0.06 + (music ? 0.25 : 0) + pop * 2) * fl;
  badge.scale.setScalar(Math.max(0.001, easeOutBack(sBadge, 1.3)));
  badge.rotation.z -= dt * (0.12 + (music ? 0.35 : 0)) * fl + (sBadge < 1 ? dt * 2.5 * (1 - sBadge) : 0);

  // background
  bgMat.uniforms.uTime.value = t;
  bgMat.uniforms.uReveal.value = easeOutCubic(seg(it, 0.0, 1.6));
  bgMat.uniforms.uPar.value.set(-tilt.x * 0.006, -tilt.y * 0.005);

  updateConfetti(dt, t);
  grain.uniforms.uTime.value = t;
  composer.render(dt);
});
</script>
</body>
